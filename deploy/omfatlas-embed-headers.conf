    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Replace frame-ancestors with production fakarny origins before deploy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors https://app.fakarny.example https://*.fakarny.example http://127.0.0.1:* http://localhost:*" always;
